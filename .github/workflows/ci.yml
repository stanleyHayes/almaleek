name: AL Maleek CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  web:
    name: Web app lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web install
      - name: Lint web app
        run: npm --prefix apps/web run lint
      - name: Build web app
        run: npm --prefix apps/web run build

  admin:
    name: Admin app lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install admin dependencies
        run: npm --prefix apps/admin install
      - name: Lint admin app
        run: npm --prefix apps/admin run lint
      - name: Build admin app
        run: npm --prefix apps/admin run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Download Go modules
        run: cd services/api && go mod download
      - name: Run Go tests
        run: cd services/api && go test ./...
      - name: Vet Go packages
        run: cd services/api && go vet ./...
