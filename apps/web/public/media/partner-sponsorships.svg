<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Event and activation support: a sponsored stage with a brand banner, microphone under spotlights and crowd hands">
  <defs>
    <linearGradient id="ps-coneMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6dd5c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6dd5c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ps-conePeach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd3b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ps-floorglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd3b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd3b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ps-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="60" y="560" width="220" height="170" fill="url(#ps-dots)"/>
  <circle cx="1100" cy="120" r="220" fill="none" stroke="#f8f8f3" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="1100" cy="120" r="280" fill="none" stroke="#f8f8f3" stroke-opacity="0.05" stroke-width="2"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">PARTNERS · EVENTS &amp; ACTIVATIONS</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">SPONSORED LIVE MOMENTS</text>

  <!-- SPONSORED chip -->
  <g transform="translate(1005,158)">
    <rect x="-142" y="-34" width="284" height="68" rx="18" fill="none" stroke="#ffd3b6" stroke-width="5"/>
    <rect x="-142" y="-34" width="284" height="68" rx="18" fill="#ffd3b6" opacity="0.12"/>
    <circle cx="-104" cy="0" r="10" fill="#ffd3b6"/>
    <text x="22" y="11" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="4" fill="#ffd3b6">SPONSORED</text>
  </g>

  <!-- spotlight cones -->
  <path d="M 380 -20 L 200 640 L 560 640 Z" fill="url(#ps-conePeach)"/>
  <path d="M 820 -20 L 640 640 L 1000 640 Z" fill="url(#ps-coneMint)"/>
  <path d="M 600 -20 L 430 640 L 770 640 Z" fill="url(#ps-conePeach)" opacity="0.5"/>
  <ellipse cx="600" cy="640" rx="400" ry="90" fill="url(#ps-floorglow)"/>

  <!-- brand banner between poles -->
  <g>
    <rect x="246" y="180" width="12" height="300" rx="6" fill="#2a2f45"/>
    <rect x="942" y="180" width="12" height="300" rx="6" fill="#2a2f45"/>
    <circle cx="252" cy="180" r="12" fill="#6dd5c4"/>
    <circle cx="948" cy="180" r="12" fill="#6dd5c4"/>
    <rect x="252" y="196" width="696" height="108" rx="20" fill="#f8f8f3" stroke="#151826" stroke-width="5"/>
    <g transform="translate(330,238)">
      <path d="M 0 -20 L 6 -6 20 -5 9 5 12 19 0 11 -12 19 -9 5 -20 -5 -6 -6 Z" fill="#ffd3b6" stroke="#151826" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <rect x="380" y="216" width="300" height="16" rx="8" fill="#151826" opacity="0.8"/>
    <rect x="380" y="248" width="220" height="14" rx="7" fill="#151826" opacity="0.35"/>
    <rect x="730" y="212" width="180" height="60" rx="14" fill="#6dd5c4"/>
    <text x="820" y="252" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#151826">× AM LIVE</text>
  </g>

  <!-- mic on stand -->
  <g transform="translate(600,0)">
    <ellipse cx="0" cy="634" rx="70" ry="14" fill="#0c0e18" stroke="#2a2f45" stroke-width="4"/>
    <rect x="-6" y="430" width="12" height="204" rx="6" fill="#2a2f45"/>
    <g transform="rotate(-10 0 430)">
      <rect x="-9" y="356" width="18" height="80" rx="9" fill="#65697a"/>
      <circle cx="0" cy="342" r="36" fill="#65697a"/>
      <path d="M -32 332 L 32 332" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M -36 344 L 36 344" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M -32 356 L 32 356" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <circle cx="0" cy="342" r="45" fill="none" stroke="#ffd3b6" stroke-width="4" opacity="0.7"/>
    </g>
    <path d="M 70 304 A 80 80 0 0 1 96 392" fill="none" stroke="#6dd5c4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 102 282 A 124 124 0 0 1 142 410" fill="none" stroke="#f8f8f3" stroke-opacity="0.35" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- crowd hands -->
  <g fill="#0c0e18">
    <g transform="translate(150,690) rotate(-12)">
      <rect x="-13" y="0" width="26" height="130" rx="13"/>
      <ellipse cx="0" cy="-15" rx="22" ry="27"/>
    </g>
    <g transform="translate(1030,694) rotate(11)">
      <rect x="-13" y="0" width="26" height="130" rx="13"/>
      <ellipse cx="0" cy="-15" rx="22" ry="27"/>
    </g>
  </g>
  <!-- phone up -->
  <g transform="translate(1140,650) rotate(-9)">
    <rect x="-13" y="16" width="26" height="120" rx="13" fill="#0c0e18"/>
    <rect x="-24" y="-88" width="48" height="86" rx="11" fill="#f8f8f3"/>
    <rect x="-16" y="-78" width="32" height="52" rx="6" fill="#ffd3b6"/>
  </g>

  <!-- star accents -->
  <path d="M 150 300 l 8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" fill="#6dd5c4"/>
  <path d="M 1010 480 l 7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#b8c0ff"/>
  <circle cx="330" cy="560" r="10" fill="#ffd3b6"/>
</svg>
