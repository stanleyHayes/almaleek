<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Content strategy track: a content calendar with highlighted posting days, an analytics bar chart and a hook-build-payoff story path">
  <defs>
    <pattern id="ac-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
    <radialGradient id="ac-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6dd5c4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6dd5c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="880" y="560" width="250" height="190" fill="url(#ac-dots)"/>
  <circle cx="1090" cy="130" r="220" fill="none" stroke="#f8f8f3" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="1090" cy="130" r="280" fill="none" stroke="#f8f8f3" stroke-opacity="0.05" stroke-width="2"/>
  <ellipse cx="600" cy="480" rx="440" ry="290" fill="url(#ac-glow)"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">ACADEMY · CONTENT STRATEGY</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">CALENDARS · ANALYTICS · STORY FRAMEWORKS</text>

  <!-- content calendar -->
  <g transform="translate(350,460) rotate(-5)">
    <rect x="-170" y="-160" width="340" height="320" rx="26" fill="#f8f8f3"/>
    <rect x="-170" y="-160" width="340" height="64" rx="26" fill="#6dd5c4"/>
    <rect x="-170" y="-122" width="340" height="26" fill="#6dd5c4"/>
    <rect x="-88" y="-184" width="16" height="44" rx="8" fill="#151826"/>
    <rect x="72" y="-184" width="16" height="44" rx="8" fill="#151826"/>
    <text x="0" y="-114" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#151826">POSTING PLAN</text>
    <!-- grid -->
    <g fill="#151826" opacity="0.08">
      <rect x="-144" y="-76" width="60" height="44" rx="9"/>
      <rect x="-72" y="-76" width="60" height="44" rx="9"/>
      <rect x="0" y="-76" width="60" height="44" rx="9"/>
      <rect x="72" y="-76" width="60" height="44" rx="9"/>
      <rect x="-144" y="-20" width="60" height="44" rx="9"/>
      <rect x="0" y="-20" width="60" height="44" rx="9"/>
      <rect x="72" y="-20" width="60" height="44" rx="9"/>
      <rect x="-144" y="36" width="60" height="44" rx="9"/>
      <rect x="-72" y="36" width="60" height="44" rx="9"/>
      <rect x="72" y="36" width="60" height="44" rx="9"/>
    </g>
    <!-- highlighted days -->
    <rect x="-72" y="-20" width="60" height="44" rx="9" fill="#ffd3b6"/>
    <rect x="0" y="36" width="60" height="44" rx="9" fill="#b8c0ff"/>
    <rect x="72" y="92" width="60" height="44" rx="9" fill="#151826" opacity="0.08"/>
    <rect x="-144" y="92" width="60" height="44" rx="9" fill="#151826" opacity="0.08"/>
    <rect x="-72" y="92" width="60" height="44" rx="9" fill="#6dd5c4"/>
    <path d="M -52 106 L -30 120 L -52 134 Z" fill="#151826"/>
  </g>

  <!-- analytics panel -->
  <g transform="translate(830,470) rotate(4)">
    <rect x="-180" y="-150" width="360" height="300" rx="26" fill="#0c0e18" stroke="#2a2f45" stroke-width="5"/>
    <text x="-140" y="-102" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#f8f8f3">WHAT WORKS</text>
    <circle cx="140" cy="-110" r="12" fill="#6dd5c4"/>
    <!-- bars -->
    <line x1="-140" y1="90" x2="140" y2="90" stroke="#2a2f45" stroke-width="4" stroke-linecap="round"/>
    <rect x="-136" y="30" width="38" height="60" rx="8" fill="#6dd5c4"/>
    <rect x="-82" y="-6" width="38" height="96" rx="8" fill="#6dd5c4" opacity="0.75"/>
    <rect x="-28" y="14" width="38" height="76" rx="8" fill="#ffd3b6"/>
    <rect x="26" y="-42" width="38" height="132" rx="8" fill="#b8c0ff"/>
    <rect x="80" y="-70" width="38" height="160" rx="8" fill="#6dd5c4"/>
    <!-- trend line -->
    <polyline points="-117,18 -63,-18 -9,4 45,-52 99,-84" fill="none" stroke="#f8f8f3" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="99" cy="-84" r="8" fill="#f8f8f3"/>
  </g>

  <!-- story framework path -->
  <g transform="translate(600,706)">
    <g transform="translate(-260,0)">
      <rect x="-90" y="-28" width="180" height="56" rx="28" fill="none" stroke="#6dd5c4" stroke-width="5"/>
      <text x="0" y="8" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#6dd5c4">HOOK</text>
    </g>
    <path d="M -150 0 L -110 0 M -122 -10 L -108 0 L -122 10" fill="none" stroke="#8a8fa3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(0,0)">
      <rect x="-90" y="-28" width="180" height="56" rx="28" fill="none" stroke="#b8c0ff" stroke-width="5"/>
      <text x="0" y="8" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#b8c0ff">BUILD</text>
    </g>
    <path d="M 110 0 L 150 0 M 138 -10 L 152 0 L 138 10" fill="none" stroke="#8a8fa3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(260,0)">
      <rect x="-96" y="-28" width="192" height="56" rx="28" fill="#ffd3b6"/>
      <text x="0" y="8" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#151826">PAYOFF</text>
    </g>
  </g>

  <!-- floating accents -->
  <circle cx="180" cy="300" r="10" fill="#b8c0ff"/>
  <circle cx="660" cy="220" r="9" fill="#6dd5c4"/>
  <path d="M 120 560 l 8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" fill="#ffd3b6"/>
</svg>
