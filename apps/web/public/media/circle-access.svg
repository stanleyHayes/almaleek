<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Early access scene with a first-look ticket, a key and a phone playing a skit">
  <defs>
    <pattern id="acc-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
    <radialGradient id="acc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6dd5c4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6dd5c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="880" y="60" width="260" height="200" fill="url(#acc-dots)"/>
  <circle cx="130" cy="660" r="240" fill="none" stroke="#f8f8f3" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="130" cy="660" r="300" fill="none" stroke="#f8f8f3" stroke-opacity="0.05" stroke-width="2"/>
  <ellipse cx="500" cy="440" rx="420" ry="300" fill="url(#acc-glow)"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">CIRCLE · EARLY ACCESS</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">FIRST TO SEE SKITS &amp; DROPS</text>

  <!-- EARLY chip -->
  <g transform="translate(1052,100)">
    <rect x="-106" y="-40" width="212" height="80" rx="20" fill="none" stroke="#ffd3b6" stroke-width="6"/>
    <rect x="-106" y="-40" width="212" height="80" rx="20" fill="#ffd3b6" opacity="0.12"/>
    <circle cx="-68" cy="0" r="12" fill="#ffd3b6"/>
    <text x="20" y="14" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="5" fill="#ffd3b6">EARLY</text>
  </g>

  <!-- first-look ticket -->
  <g transform="translate(440,440) rotate(-7)">
    <rect x="-230" y="-130" width="460" height="260" rx="30" fill="#6dd5c4"/>
    <circle cx="-230" cy="0" r="26" fill="#151826"/>
    <circle cx="230" cy="0" r="26" fill="#151826"/>
    <line x1="92" y1="-110" x2="92" y2="110" stroke="#151826" stroke-width="5" stroke-dasharray="4 18" stroke-linecap="round"/>
    <!-- play button -->
    <circle cx="-72" cy="-18" r="58" fill="#151826"/>
    <path d="M -92 -46 L -28 -18 L -92 10 Z" fill="#6dd5c4"/>
    <text x="-72" y="86" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#151826">FIRST LOOK</text>
    <text x="162" y="14" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-2" fill="#151826">01</text>
    <text x="162" y="56" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#151826" opacity="0.7">MEMBER</text>
  </g>

  <!-- key -->
  <g transform="translate(838,300) rotate(18)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#ffd3b6" stroke-width="22"/>
    <rect x="36" y="-11" width="190" height="22" rx="11" fill="#ffd3b6"/>
    <rect x="176" y="8" width="20" height="44" rx="8" fill="#ffd3b6"/>
    <rect x="212" y="8" width="20" height="30" rx="8" fill="#ffd3b6"/>
  </g>

  <!-- phone playing a skit -->
  <g transform="translate(905,540) rotate(6)">
    <rect x="-104" y="-188" width="208" height="376" rx="40" fill="#0c0e18" stroke="#2a2f45" stroke-width="5"/>
    <rect x="-84" y="-166" width="168" height="332" rx="28" fill="#151826"/>
    <rect x="-30" y="-156" width="60" height="12" rx="6" fill="#2a2f45"/>
    <!-- skit card -->
    <rect x="-66" y="-124" width="132" height="110" rx="16" fill="#e7d8ff"/>
    <circle cx="-22" cy="-92" r="17" fill="#151826"/>
    <ellipse cx="-22" cy="-87" rx="7" ry="5" fill="#ffd3b6"/>
    <path d="M -40 -16 L -40 -46 A 18 18 0 0 1 -4 -46 L -4 -16 Z" fill="#151826"/>
    <circle cx="34" cy="-60" r="17" fill="#6dd5c4" stroke="#151826" stroke-width="4"/>
    <path d="M 29 -68 L 43 -60 L 29 -52 Z" fill="#151826"/>
    <!-- caption lines -->
    <rect x="-66" y="6" width="132" height="10" rx="5" fill="#2a2f45"/>
    <rect x="-66" y="28" width="92" height="10" rx="5" fill="#2a2f45"/>
    <rect x="-66" y="50" width="110" height="10" rx="5" fill="#6dd5c4"/>
    <!-- progress -->
    <rect x="-66" y="84" width="132" height="8" rx="4" fill="#2a2f45"/>
    <rect x="-66" y="84" width="80" height="8" rx="4" fill="#ffd3b6"/>
  </g>

  <!-- early clock -->
  <g transform="translate(238,244)">
    <circle cx="0" cy="0" r="58" fill="#151826" stroke="#b8c0ff" stroke-width="8"/>
    <circle cx="0" cy="0" r="7" fill="#b8c0ff"/>
    <path d="M 0 0 L 0 -34" stroke="#b8c0ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 0 L 24 12" stroke="#b8c0ff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- unlock arcs -->
  <path d="M 668 330 A 130 130 0 0 1 706 470" fill="none" stroke="#6dd5c4" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 712 300 A 190 190 0 0 1 768 500" fill="none" stroke="#f8f8f3" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>

  <!-- floating accents -->
  <circle cx="770" cy="620" r="12" fill="#ffd3b6"/>
  <circle cx="300" cy="620" r="10" fill="#b8c0ff"/>
  <circle cx="660" cy="180" r="9" fill="#6dd5c4"/>
</svg>
