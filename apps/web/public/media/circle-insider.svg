<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Insider line scene with chat bubbles from Al Maleek, a question reply and a live poll card">
  <defs>
    <pattern id="ins-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
    <radialGradient id="ins-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8c0ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b8c0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="890" y="560" width="250" height="190" fill="url(#ins-dots)"/>
  <circle cx="110" cy="120" r="210" fill="none" stroke="#f8f8f3" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="110" cy="120" r="270" fill="none" stroke="#f8f8f3" stroke-opacity="0.05" stroke-width="2"/>
  <ellipse cx="420" cy="380" rx="380" ry="280" fill="url(#ins-glow)"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">CIRCLE · INSIDER LINE</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">POLLS · Q&amp;A · DIRECT FROM AL MALEEK</text>

  <!-- big bubble from AM -->
  <g transform="translate(420,360) rotate(-3)">
    <rect x="-220" y="-130" width="440" height="240" rx="48" fill="#6dd5c4"/>
    <path d="M -60 108 L -96 178 L 6 110 Z" fill="#6dd5c4"/>
    <!-- avatar -->
    <circle cx="-148" cy="-58" r="46" fill="#151826"/>
    <circle cx="-148" cy="-66" r="16" fill="#ffd3b6"/>
    <path d="M -172 -34 A 24 20 0 0 1 -124 -34 L -124 -20 L -172 -20 Z" fill="#ffd3b6"/>
    <!-- message lines -->
    <rect x="-76" y="-84" width="272" height="16" rx="8" fill="#151826" opacity="0.85"/>
    <rect x="-76" y="-54" width="220" height="16" rx="8" fill="#151826" opacity="0.5"/>
    <rect x="-76" y="-24" width="250" height="16" rx="8" fill="#151826" opacity="0.5"/>
    <text x="40" y="68" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="4" fill="#151826">STRAIGHT FROM AM</text>
  </g>

  <!-- reply bubble with question -->
  <g transform="translate(838,560) rotate(4)">
    <rect x="-140" y="-86" width="280" height="150" rx="36" fill="#0c0e18" stroke="#2a2f45" stroke-width="5"/>
    <path d="M 60 62 L 96 124 L -8 64 Z" fill="#0c0e18" stroke="#2a2f45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 52 58 L 92 122 L 6 60 Z" fill="#0c0e18"/>
    <text x="-60" y="20" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffd3b6">?</text>
    <rect x="6" y="-38" width="102" height="13" rx="6.5" fill="#f8f8f3" opacity="0.85"/>
    <rect x="6" y="-10" width="72" height="13" rx="6.5" fill="#8a8fa3"/>
    <rect x="6" y="18" width="90" height="13" rx="6.5" fill="#6dd5c4"/>
  </g>

  <!-- signal arcs (direct line) -->
  <path d="M 668 240 A 90 90 0 0 1 700 340" fill="none" stroke="#6dd5c4" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 706 214 A 140 140 0 0 1 756 366" fill="none" stroke="#ffd3b6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="648" cy="300" r="10" fill="#6dd5c4"/>

  <!-- poll card -->
  <g transform="translate(880,250) rotate(5)">
    <rect x="-190" y="-110" width="380" height="230" rx="28" fill="#f8f8f3"/>
    <text x="-150" y="-66" font-family="Outfit, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#151826">MEMBER POLL</text>
    <circle cx="150" cy="-72" r="14" fill="#6dd5c4"/>
    <!-- option 1 -->
    <rect x="-150" y="-36" width="300" height="26" rx="13" fill="#e8e8e0"/>
    <rect x="-150" y="-36" width="216" height="26" rx="13" fill="#6dd5c4"/>
    <!-- option 2 -->
    <rect x="-150" y="8" width="300" height="26" rx="13" fill="#e8e8e0"/>
    <rect x="-150" y="8" width="132" height="26" rx="13" fill="#ffd3b6"/>
    <!-- option 3 -->
    <rect x="-150" y="52" width="300" height="26" rx="13" fill="#e8e8e0"/>
    <rect x="-150" y="52" width="72" height="26" rx="13" fill="#b8c0ff"/>
    <text x="150" y="108" text-anchor="end" font-family="Outfit, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#65697a">YOU VOTED</text>
  </g>

  <!-- floating accents -->
  <circle cx="240" cy="620" r="12" fill="#ffd3b6"/>
  <circle cx="180" cy="400" r="9" fill="#b8c0ff"/>
  <circle cx="640" cy="620" r="10" fill="#6dd5c4"/>
  <path d="M 1050 470 l 8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" fill="#6dd5c4"/>
</svg>
