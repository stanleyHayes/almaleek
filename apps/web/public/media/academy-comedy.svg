<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Comedy and performance track: a microphone under spotlights, a joke notebook and a HA burst">
  <defs>
    <linearGradient id="aco-coneMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6dd5c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6dd5c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aco-conePeach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd3b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aco-floorglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6dd5c4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6dd5c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="aco-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="60" y="60" width="220" height="170" fill="url(#aco-dots)"/>
  <circle cx="1100" cy="660" r="230" fill="none" stroke="#f8f8f3" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="1100" cy="660" r="290" fill="none" stroke="#f8f8f3" stroke-opacity="0.05" stroke-width="2"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">ACADEMY · COMEDY &amp; PERFORMANCE</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">STAGECRAFT · JOKE WRITING · DELIVERY</text>

  <!-- spotlight cones -->
  <path d="M 480 -20 L 300 640 L 660 640 Z" fill="url(#aco-conePeach)"/>
  <path d="M 820 -20 L 640 640 L 1000 640 Z" fill="url(#aco-coneMint)"/>
  <path d="M 650 -20 L 480 640 L 820 640 Z" fill="url(#aco-conePeach)" opacity="0.55"/>
  <ellipse cx="650" cy="640" rx="380" ry="85" fill="url(#aco-floorglow)"/>

  <!-- mic on stand -->
  <g transform="translate(650,0)">
    <ellipse cx="0" cy="634" rx="70" ry="14" fill="#0c0e18" stroke="#2a2f45" stroke-width="4"/>
    <rect x="-6" y="430" width="12" height="204" rx="6" fill="#2a2f45"/>
    <g transform="rotate(10 0 430)">
      <rect x="-9" y="356" width="18" height="80" rx="9" fill="#65697a"/>
      <circle cx="0" cy="342" r="36" fill="#65697a"/>
      <path d="M -32 332 L 32 332" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M -36 344 L 36 344" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M -32 356 L 32 356" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <circle cx="0" cy="342" r="45" fill="none" stroke="#6dd5c4" stroke-width="4" opacity="0.7"/>
    </g>
    <path d="M -96 300 A 84 84 0 0 0 -122 392" fill="none" stroke="#6dd5c4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M -130 276 A 128 128 0 0 0 -170 412" fill="none" stroke="#ffd3b6" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- HA burst -->
  <g transform="translate(920,300) rotate(8)">
    <path d="M 0 -92 L 22 -44 L 74 -58 L 46 -16 L 92 6 L 42 24 L 58 76 L 12 44 L -16 90 L -26 38 L -80 50 L -42 10 L -78 -30 L -26 -26 Z" fill="#ffd3b6" stroke="#151826" stroke-width="5" stroke-linejoin="round"/>
    <text x="0" y="16" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1" fill="#151826">HA!</text>
  </g>

  <!-- joke notebook -->
  <g transform="translate(262,480) rotate(-8)">
    <rect x="-120" y="-160" width="240" height="320" rx="22" fill="#f8f8f3"/>
    <line x1="-84" y1="-160" x2="-84" y2="160" stroke="#b8c0ff" stroke-width="4"/>
    <text x="-58" y="-118" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#151826">NEW JOKES</text>
    <rect x="-58" y="-92" width="160" height="11" rx="5.5" fill="#151826" opacity="0.7"/>
    <rect x="-58" y="-68" width="128" height="11" rx="5.5" fill="#151826" opacity="0.4"/>
    <rect x="-58" y="-44" width="148" height="11" rx="5.5" fill="#151826" opacity="0.4"/>
    <!-- punchline highlighted -->
    <rect x="-66" y="-12" width="178" height="30" rx="8" fill="#6dd5c4"/>
    <rect x="-58" y="-3" width="140" height="11" rx="5.5" fill="#151826"/>
    <rect x="-58" y="42" width="150" height="11" rx="5.5" fill="#151826" opacity="0.4"/>
    <rect x="-58" y="66" width="112" height="11" rx="5.5" fill="#151826" opacity="0.4"/>
    <rect x="-58" y="100" width="98" height="14" rx="7" fill="#ffd3b6"/>
    <!-- pencil -->
    <g transform="translate(96,116) rotate(40)">
      <rect x="-8" y="-64" width="16" height="96" rx="6" fill="#ffd3b6" stroke="#151826" stroke-width="4"/>
      <path d="M -8 -64 L 0 -88 L 8 -64 Z" fill="#151826"/>
    </g>
  </g>

  <!-- star accents -->
  <path d="M 1060 480 l 9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 Z" fill="#b8c0ff"/>
  <path d="M 420 250 l 7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#6dd5c4"/>
  <circle cx="180" cy="660" r="10" fill="#ffd3b6"/>
  <circle cx="1050" cy="180" r="9" fill="#6dd5c4"/>
</svg>
