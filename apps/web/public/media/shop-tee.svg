<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Mint AL Maleek tee shirt product mockup with hangtag">
  <defs>
    <pattern id="speckle" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="4" fill="#151826" opacity="0.1"/>
      <circle cx="27" cy="27" r="2.5" fill="#151826" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#f8f8f3"/>
  <circle cx="600" cy="440" r="330" fill="#dff6f0"/>
  <circle cx="600" cy="440" r="398" fill="none" stroke="#151826" stroke-opacity="0.1" stroke-width="2.5"/>
  <path d="M -40 820 A 360 360 0 0 1 320 460" fill="none" stroke="#ffd3b6" stroke-width="24" stroke-linecap="round"/>
  <rect x="880" y="80" width="240" height="190" fill="url(#speckle)"/>
  <circle cx="150" cy="150" r="20" fill="#b8c0ff"/>
  <circle cx="1060" cy="720" r="26" fill="#ffd3b6"/>

  <!-- shadow -->
  <ellipse cx="600" cy="806" rx="270" ry="28" fill="#151826" opacity="0.09"/>

  <!-- tee -->
  <g>
    <path d="M 502 268
             L 372 330 L 416 436 L 482 402
             L 482 748 A 20 20 0 0 0 502 768
             L 698 768 A 20 20 0 0 0 718 748
             L 718 402 L 784 436 L 828 330 L 698 268
             A 98 62 0 0 1 502 268 Z"
          fill="#6dd5c4"/>
    <!-- collar rib -->
    <path d="M 508 272 A 92 56 0 0 0 692 272" fill="none" stroke="#151826" stroke-opacity="0.3" stroke-width="7"/>
    <!-- stitching -->
    <path d="M 500 736 L 700 736" stroke="#151826" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/>
    <path d="M 400 418 L 436 354" stroke="#151826" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/>
    <path d="M 800 418 L 764 354" stroke="#151826" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/>
    <!-- sleeve fold shading -->
    <path d="M 482 402 L 416 436 L 372 330 Z" fill="#151826" opacity="0.06"/>
    <path d="M 718 402 L 784 436 L 828 330 Z" fill="#151826" opacity="0.06"/>

    <!-- chest wordmark -->
    <text x="600" y="508" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="10" fill="#151826">AL MALEEK</text>
    <text x="600" y="552" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="7" fill="#151826" opacity="0.6">&amp; CREW · ACCRA</text>
  </g>

  <!-- hangtag -->
  <path d="M 706 292 C 790 300 830 340 842 400" fill="none" stroke="#151826" stroke-width="4"/>
  <g transform="translate(848,452) rotate(10)">
    <circle cx="0" cy="0" r="52" fill="#ffffff" stroke="#151826" stroke-width="5"/>
    <circle cx="0" cy="-38" r="6" fill="#f8f8f3" stroke="#151826" stroke-width="4"/>
    <text x="0" y="16" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-2" fill="#151826">AM</text>
  </g>

  <text x="80" y="112" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#4a7069">THE SHOP</text>
  <text x="82" y="152" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="4" fill="#65697a">SIGNATURE TEE · MINT</text>
</svg>
