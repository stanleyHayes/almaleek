<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Growth pathways scene with rising steps, a chart arrow, a flag at the summit and a young sprout">
  <defs>
    <pattern id="grw-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
    <radialGradient id="grw-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd3b6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd3b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="60" y="540" width="250" height="200" fill="url(#grw-dots)"/>
  <circle cx="1080" cy="640" r="230" fill="none" stroke="#f8f8f3" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="1080" cy="640" r="290" fill="none" stroke="#f8f8f3" stroke-opacity="0.05" stroke-width="2"/>
  <ellipse cx="820" cy="260" rx="360" ry="260" fill="url(#grw-glow)"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">CIRCLE · GROWTH PATHWAYS</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">ACADEMY · OPPORTUNITIES · COLLABS</text>

  <!-- steps -->
  <g stroke="#2a2f45" stroke-width="5">
    <rect x="180" y="560" width="200" height="180" rx="24" fill="#0c0e18"/>
    <rect x="380" y="460" width="200" height="280" rx="24" fill="#0c0e18"/>
    <rect x="580" y="360" width="200" height="380" rx="24" fill="#0c0e18"/>
  </g>
  <!-- step labels -->
  <text x="280" y="628" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="3" fill="#b8c0ff">LEARN</text>
  <text x="480" y="528" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="3" fill="#6dd5c4">CREATE</text>
  <text x="680" y="428" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="3" fill="#ffd3b6">SHINE</text>

  <!-- rising chart arrow -->
  <polyline points="212,700 320,640 480,560 610,470 760,330" fill="none" stroke="#6dd5c4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="320" cy="640" r="13" fill="#151826" stroke="#6dd5c4" stroke-width="6"/>
  <circle cx="480" cy="560" r="13" fill="#151826" stroke="#6dd5c4" stroke-width="6"/>
  <circle cx="610" cy="470" r="13" fill="#151826" stroke="#6dd5c4" stroke-width="6"/>
  <path d="M 760 330 L 706 330 M 760 330 L 760 384" fill="none" stroke="#6dd5c4" stroke-width="12" stroke-linecap="round"/>

  <!-- flag on summit -->
  <g transform="translate(680,0)">
    <rect x="-6" y="180" width="12" height="182" rx="6" fill="#8a8fa3"/>
    <path d="M 6 188 L 128 224 L 6 260 Z" fill="#ffd3b6"/>
    <circle cx="0" cy="180" r="12" fill="#ffd3b6"/>
  </g>

  <!-- sprout -->
  <g transform="translate(280,560)">
    <path d="M 0 0 C -4 -40 -4 -60 0 -84" fill="none" stroke="#6dd5c4" stroke-width="9" stroke-linecap="round"/>
    <path d="M 0 -58 C -34 -62 -52 -84 -54 -112 C -26 -108 -6 -88 0 -58 Z" fill="#6dd5c4"/>
    <path d="M 0 -84 C 30 -86 48 -106 52 -134 C 24 -132 4 -112 0 -84 Z" fill="#6dd5c4" opacity="0.75"/>
  </g>

  <!-- graduation cap -->
  <g transform="translate(950,470) rotate(-6)">
    <path d="M -96 0 L 0 -42 L 96 0 L 0 42 Z" fill="#b8c0ff"/>
    <path d="M -52 16 L -52 58 A 52 26 0 0 0 52 58 L 52 16 L 0 42 Z" fill="#b8c0ff" opacity="0.55"/>
    <path d="M 96 0 L 96 66" stroke="#b8c0ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="96" cy="78" r="12" fill="#ffd3b6"/>
  </g>

  <!-- collab link -->
  <g transform="translate(950,220) rotate(8)">
    <rect x="-110" y="-34" width="150" height="68" rx="34" fill="none" stroke="#ffd3b6" stroke-width="14"/>
    <rect x="-40" y="-34" width="150" height="68" rx="34" fill="none" stroke="#6dd5c4" stroke-width="14"/>
  </g>

  <!-- star accents -->
  <path d="M 830 560 l 10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 Z" fill="#ffd3b6"/>
  <path d="M 160 300 l 8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" fill="#6dd5c4"/>
  <path d="M 520 220 l 7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#b8c0ff"/>
  <circle cx="1060" cy="640" r="10" fill="#6dd5c4"/>
</svg>
