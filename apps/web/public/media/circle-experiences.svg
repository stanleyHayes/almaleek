<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Member-only live experience: stage with spotlights, microphone, member pass and crowd hands">
  <defs>
    <linearGradient id="exp-coneMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6dd5c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6dd5c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="exp-conePeach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd3b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="exp-floorglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6dd5c4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6dd5c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="exp-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="60" y="60" width="220" height="170" fill="url(#exp-dots)"/>
  <circle cx="1090" cy="120" r="220" fill="none" stroke="#f8f8f3" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="1090" cy="120" r="280" fill="none" stroke="#f8f8f3" stroke-opacity="0.05" stroke-width="2"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">CIRCLE · LIVE EXPERIENCES</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">SHOWS · MEETUPS · MEMBERS ONLY</text>

  <!-- spotlight cones -->
  <path d="M 400 -20 L 210 640 L 590 640 Z" fill="url(#exp-conePeach)"/>
  <path d="M 800 -20 L 610 640 L 990 640 Z" fill="url(#exp-coneMint)"/>
  <path d="M 600 -20 L 430 640 L 770 640 Z" fill="url(#exp-conePeach)" opacity="0.55"/>

  <!-- stage floor glow -->
  <ellipse cx="600" cy="640" rx="400" ry="90" fill="url(#exp-floorglow)"/>

  <!-- mic on stand -->
  <g transform="translate(600,0)">
    <ellipse cx="0" cy="634" rx="70" ry="14" fill="#0c0e18" stroke="#2a2f45" stroke-width="4"/>
    <rect x="-6" y="430" width="12" height="204" rx="6" fill="#2a2f45"/>
    <g transform="rotate(-12 0 430)">
      <rect x="-9" y="356" width="18" height="80" rx="9" fill="#65697a"/>
      <circle cx="0" cy="342" r="36" fill="#65697a"/>
      <path d="M -32 332 L 32 332" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M -36 344 L 36 344" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M -32 356 L 32 356" stroke="#dff6f0" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <circle cx="0" cy="342" r="45" fill="none" stroke="#6dd5c4" stroke-width="4" opacity="0.7"/>
    </g>
    <!-- sound arcs -->
    <path d="M 70 304 A 80 80 0 0 1 96 392" fill="none" stroke="#6dd5c4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 102 282 A 124 124 0 0 1 142 410" fill="none" stroke="#ffd3b6" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- member pass -->
  <g transform="translate(232,420) rotate(-9)">
    <line x1="0" y1="-160" x2="0" y2="-96" stroke="#8a8fa3" stroke-width="7"/>
    <rect x="-92" y="-96" width="184" height="252" rx="24" fill="#0c0e18" stroke="#6dd5c4" stroke-width="5"/>
    <rect x="-60" y="-80" width="120" height="14" rx="7" fill="#151826" stroke="#6dd5c4" stroke-width="3"/>
    <text x="0" y="-28" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="#6dd5c4">AM</text>
    <rect x="-58" y="2" width="116" height="11" rx="5.5" fill="#f8f8f3" opacity="0.85"/>
    <rect x="-58" y="26" width="78" height="11" rx="5.5" fill="#8a8fa3"/>
    <rect x="-58" y="58" width="116" height="34" rx="17" fill="#ffd3b6"/>
    <text x="0" y="82" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="2" fill="#151826">MEMBER</text>
    <rect x="-58" y="108" width="116" height="10" rx="5" fill="#2a2f45"/>
    <rect x="-58" y="108" width="70" height="10" rx="5" fill="#b8c0ff"/>
  </g>

  <!-- ticket stub -->
  <g transform="translate(948,440) rotate(8)">
    <rect x="-120" y="-70" width="240" height="140" rx="20" fill="#ffd3b6"/>
    <circle cx="-120" cy="0" r="16" fill="#151826"/>
    <circle cx="120" cy="0" r="16" fill="#151826"/>
    <line x1="48" y1="-56" x2="48" y2="56" stroke="#151826" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
    <text x="-28" y="-6" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3" fill="#151826">SHOW</text>
    <text x="-28" y="30" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#151826" opacity="0.7">NIGHT</text>
    <path d="M 60 -12 L 96 -12 M 60 12 L 84 12" stroke="#151826" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- star accents -->
  <path d="M 1020 250 l 10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 Z" fill="#b8c0ff"/>
  <path d="M 180 250 l 8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" fill="#6dd5c4"/>
  <path d="M 880 590 l 7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#ffd3b6"/>

  <!-- crowd hands -->
  <g fill="#0c0e18">
    <g transform="translate(120,690) rotate(-12)">
      <rect x="-13" y="0" width="26" height="130" rx="13"/>
      <ellipse cx="0" cy="-15" rx="22" ry="27"/>
    </g>
    <g transform="translate(1010,700) rotate(11)">
      <rect x="-13" y="0" width="26" height="130" rx="13"/>
      <ellipse cx="0" cy="-15" rx="22" ry="27"/>
    </g>
    <g transform="translate(1120,706) rotate(-8)">
      <rect x="-13" y="0" width="26" height="130" rx="13"/>
      <ellipse cx="0" cy="-15" rx="22" ry="27"/>
    </g>
  </g>
  <!-- phone up -->
  <g transform="translate(80,650) rotate(9)">
    <rect x="-13" y="16" width="26" height="120" rx="13" fill="#0c0e18"/>
    <rect x="-24" y="-88" width="48" height="86" rx="11" fill="#f8f8f3"/>
    <rect x="-16" y="-78" width="32" height="52" rx="6" fill="#6dd5c4"/>
  </g>
</svg>
