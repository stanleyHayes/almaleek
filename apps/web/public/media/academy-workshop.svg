<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Workshop scene with presenter at a sketch board and seated attendees">
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4.5" fill="#151826" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1600" height="700" fill="#dff6f0"/>
  <circle cx="940" cy="330" r="330" fill="#a7c4a0" opacity="0.55"/>
  <circle cx="940" cy="330" r="402" fill="none" stroke="#151826" stroke-opacity="0.1" stroke-width="2.5"/>
  <path d="M -60 640 A 420 420 0 0 1 360 220" fill="none" stroke="#6dd5c4" stroke-width="26" stroke-linecap="round"/>
  <path d="M -30 700 A 480 480 0 0 1 450 230" fill="none" stroke="#151826" stroke-opacity="0.14" stroke-width="4"/>
  <rect x="1390" y="70" width="170" height="170" fill="url(#dots)"/>
  <circle cx="1500" cy="520" r="24" fill="#ffd3b6"/>

  <!-- board -->
  <g>
    <rect x="540" y="90" width="820" height="450" rx="30" fill="#151826"/>
    <rect x="540" y="90" width="820" height="450" rx="30" fill="none" stroke="#151826" stroke-opacity="0.3" stroke-width="8"/>
    <!-- chalk title -->
    <text x="590" y="158" font-family="Outfit, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="7" fill="#6dd5c4">SKIT LAB</text>
    <path d="M 590 178 L 830 178" stroke="#6dd5c4" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- lightbulb sketch -->
    <g transform="translate(700,320)">
      <circle cx="0" cy="-20" r="52" fill="none" stroke="#dff6f0" stroke-width="6"/>
      <path d="M -20 22 L -20 46 L 20 46 L 20 22" fill="none" stroke="#dff6f0" stroke-width="6" stroke-linejoin="round"/>
      <path d="M -18 62 L 18 62" stroke="#dff6f0" stroke-width="6" stroke-linecap="round"/>
      <path d="M 0 -104 L 0 -86" stroke="#ffd3b6" stroke-width="6" stroke-linecap="round"/>
      <path d="M -72 -76 L -58 -64" stroke="#ffd3b6" stroke-width="6" stroke-linecap="round"/>
      <path d="M 72 -76 L 58 -64" stroke="#ffd3b6" stroke-width="6" stroke-linecap="round"/>
      <path d="M -94 -20 L -74 -20" stroke="#ffd3b6" stroke-width="6" stroke-linecap="round"/>
      <path d="M 94 -20 L 74 -20" stroke="#ffd3b6" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- bar chart sketch -->
    <g transform="translate(960,290)">
      <path d="M -80 110 L -80 -60 M -80 110 L 120 110" fill="none" stroke="#dff6f0" stroke-width="6" stroke-linecap="round"/>
      <rect x="-52" y="30" width="34" height="80" rx="8" fill="#b8c0ff"/>
      <rect x="2" y="-10" width="34" height="120" rx="8" fill="#6dd5c4"/>
      <rect x="56" y="-52" width="34" height="162" rx="8" fill="#ffd3b6"/>
      <path d="M -46 -2 L 24 -38 L 74 -78" fill="none" stroke="#dff6f0" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
    </g>

    <!-- play icon sketch -->
    <g transform="translate(1220,300)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#dff6f0" stroke-width="6"/>
      <path d="M -18 -28 L 34 0 L -18 28 Z" fill="#6dd5c4"/>
    </g>

    <!-- squiggle notes -->
    <path d="M 590 470 q 18 -18 36 0 t 36 0 t 36 0" fill="none" stroke="#dff6f0" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
    <rect x="590" y="220" width="150" height="12" rx="6" fill="#dff6f0" opacity="0.35"/>
    <rect x="590" y="248" width="110" height="12" rx="6" fill="#dff6f0" opacity="0.22"/>
  </g>

  <!-- presenter -->
  <g>
    <!-- pointer stick -->
    <path d="M 452 380 L 610 300" stroke="#151826" stroke-width="9" stroke-linecap="round"/>
    <circle cx="616" cy="297" r="10" fill="#ffd3b6"/>
    <!-- body -->
    <path d="M 300 640 L 300 470 A 78 74 0 0 1 456 470 L 456 640 Z" fill="#151826"/>
    <!-- arm holding pointer -->
    <g transform="rotate(38 440 500)">
      <rect x="420" y="420" width="40" height="150" rx="20" fill="#151826"/>
    </g>
    <!-- head -->
    <circle cx="378" cy="392" r="62" fill="#151826"/>
    <path d="M 340 408 A 42 42 0 0 0 416 408" fill="none" stroke="#dff6f0" stroke-width="8" stroke-linecap="round"/>
    <!-- cap -->
    <path d="M 316 380 A 62 62 0 0 1 440 380 Z" fill="#6dd5c4"/>
    <rect x="410" y="366" width="62" height="20" rx="10" fill="#6dd5c4"/>
  </g>

  <!-- attendees -->
  <g>
    <g transform="translate(660,672)">
      <path d="M -64 28 L -64 -6 A 64 60 0 0 1 64 -6 L 64 28 Z" fill="#a7c4a0"/>
      <circle cx="0" cy="-58" r="42" fill="#a7c4a0"/>
    </g>
    <g transform="translate(830,682)">
      <path d="M -68 18 L -68 -10 A 68 64 0 0 1 68 -10 L 68 18 Z" fill="#6dd5c4"/>
      <circle cx="0" cy="-62" r="45" fill="#6dd5c4"/>
    </g>
    <g transform="translate(1010,670)">
      <path d="M -64 30 L -64 -6 A 64 60 0 0 1 64 -6 L 64 30 Z" fill="#b8c0ff"/>
      <circle cx="0" cy="-58" r="42" fill="#b8c0ff"/>
    </g>
    <g transform="translate(1180,684)">
      <path d="M -68 16 L -68 -10 A 68 64 0 0 1 68 -10 L 68 16 Z" fill="#a7c4a0"/>
      <circle cx="0" cy="-62" r="45" fill="#a7c4a0"/>
    </g>
    <g transform="translate(1350,672)">
      <path d="M -64 28 L -64 -6 A 64 60 0 0 1 64 -6 L 64 28 Z" fill="#ffd3b6"/>
      <circle cx="0" cy="-58" r="42" fill="#ffd3b6"/>
    </g>
  </g>

  <text x="70" y="105" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#4a7069">THE ACADEMY</text>
  <text x="72" y="146" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="5" fill="#65697a">LEARN THE CRAFT · ACCRA</text>
</svg>
