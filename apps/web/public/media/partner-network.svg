<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Creative ecosystem: a central Al Maleek node connected to collaborator nodes for talent, brands, shows and content">
  <defs>
    <pattern id="pn-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#f8f8f3" opacity="0.07"/>
    </pattern>
    <radialGradient id="pn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8c0ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#b8c0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#151826"/>
  <rect x="880" y="570" width="250" height="180" fill="url(#pn-dots)"/>
  <circle cx="600" cy="440" r="300" fill="none" stroke="#f8f8f3" stroke-opacity="0.07" stroke-width="2.5"/>
  <circle cx="600" cy="440" r="360" fill="none" stroke="#f8f8f3" stroke-opacity="0.04" stroke-width="2"/>
  <ellipse cx="600" cy="440" rx="380" ry="300" fill="url(#pn-glow)"/>

  <!-- header -->
  <text x="70" y="96" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#6dd5c4">PARTNERS · CREATIVE ECOSYSTEM</text>
  <text x="72" y="134" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8a8fa3">TALENT · BRANDS · ONE NETWORK</text>

  <!-- orbit ring -->
  <circle cx="600" cy="440" r="215" fill="none" stroke="#2a2f45" stroke-width="4" stroke-dasharray="3 16" stroke-linecap="round"/>

  <!-- connection lines -->
  <g stroke="#2a2f45" stroke-width="5" stroke-linecap="round">
    <line x1="600" y1="440" x2="815" y2="440"/>
    <line x1="600" y1="440" x2="707" y2="626"/>
    <line x1="600" y1="440" x2="493" y2="626"/>
    <line x1="600" y1="440" x2="385" y2="440"/>
    <line x1="600" y1="440" x2="493" y2="254"/>
    <line x1="600" y1="440" x2="707" y2="254"/>
  </g>

  <!-- central AM node -->
  <g transform="translate(600,440)">
    <circle cx="0" cy="0" r="84" fill="#6dd5c4" stroke="#151826" stroke-width="6"/>
    <circle cx="0" cy="0" r="104" fill="none" stroke="#6dd5c4" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 14"/>
    <text x="0" y="24" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="#151826">AM</text>
  </g>

  <!-- satellite nodes -->
  <!-- play / content -->
  <g transform="translate(815,440)">
    <circle cx="0" cy="0" r="52" fill="#0c0e18" stroke="#6dd5c4" stroke-width="5"/>
    <path d="M -12 -18 L 22 0 L -12 18 Z" fill="#6dd5c4"/>
  </g>
  <!-- star / talent -->
  <g transform="translate(707,626)">
    <circle cx="0" cy="0" r="52" fill="#0c0e18" stroke="#ffd3b6" stroke-width="5"/>
    <path d="M 0 -20 L 6 -7 20 -6 9 4 12 18 0 10 -12 18 -9 4 -20 -6 -6 -7 Z" fill="#ffd3b6"/>
  </g>
  <!-- person / community -->
  <g transform="translate(493,626)">
    <circle cx="0" cy="0" r="52" fill="#0c0e18" stroke="#b8c0ff" stroke-width="5"/>
    <circle cx="0" cy="-10" r="13" fill="#b8c0ff"/>
    <path d="M -22 26 A 22 18 0 0 1 22 26 Z" fill="#b8c0ff"/>
  </g>
  <!-- briefcase / brands -->
  <g transform="translate(385,440)">
    <circle cx="0" cy="0" r="52" fill="#0c0e18" stroke="#ffd3b6" stroke-width="5"/>
    <rect x="-22" y="-8" width="44" height="30" rx="8" fill="#ffd3b6"/>
    <rect x="-10" y="-18" width="20" height="12" rx="5" fill="none" stroke="#ffd3b6" stroke-width="5"/>
    <rect x="-4" y="4" width="8" height="8" rx="2" fill="#151826"/>
  </g>
  <!-- chat / collabs -->
  <g transform="translate(493,254)">
    <circle cx="0" cy="0" r="52" fill="#0c0e18" stroke="#6dd5c4" stroke-width="5"/>
    <rect x="-22" y="-16" width="40" height="28" rx="9" fill="#6dd5c4"/>
    <path d="M -8 12 L -16 26 L 4 12 Z" fill="#6dd5c4"/>
    <circle cx="-11" cy="-2" r="3.5" fill="#151826"/>
    <circle cx="1" cy="-2" r="3.5" fill="#151826"/>
    <circle cx="13" cy="-2" r="3.5" fill="#151826"/>
  </g>
  <!-- mic / shows -->
  <g transform="translate(707,254)">
    <circle cx="0" cy="0" r="52" fill="#0c0e18" stroke="#b8c0ff" stroke-width="5"/>
    <rect x="-9" y="-18" width="18" height="30" rx="9" fill="#b8c0ff"/>
    <path d="M -18 -6 A 18 18 0 0 0 18 -6" fill="none" stroke="#b8c0ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="0" y2="22" stroke="#b8c0ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="-12" y1="24" x2="12" y2="24" stroke="#b8c0ff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- node labels -->
  <text x="815" y="524" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8a8fa3">CONTENT</text>
  <text x="707" y="712" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8a8fa3">TALENT</text>
  <text x="493" y="712" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8a8fa3">COMMUNITY</text>
  <text x="385" y="524" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8a8fa3">BRANDS</text>
  <text x="493" y="180" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8a8fa3">COLLABS</text>
  <text x="707" y="180" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8a8fa3">SHOWS</text>

  <!-- floating accents -->
  <circle cx="180" cy="560" r="10" fill="#ffd3b6"/>
  <circle cx="1030" cy="280" r="9" fill="#6dd5c4"/>
  <path d="M 1010 620 l 8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" fill="#b8c0ff"/>
</svg>
