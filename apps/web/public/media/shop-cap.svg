<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Ink cap with mint AM monogram product mockup on periwinkle backdrop">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7d8ff"/>
      <stop offset="1" stop-color="#b8c0ff"/>
    </linearGradient>
    <pattern id="halftone" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="5" fill="#151826" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#wash)"/>
  <path d="M 0 0 L 420 0 A 420 420 0 0 1 0 420 Z" fill="#b8c0ff" opacity="0.8"/>
  <path d="M 1200 900 L 830 900 A 370 370 0 0 1 1200 530 Z" fill="#6dd5c4" opacity="0.5"/>
  <circle cx="600" cy="470" r="330" fill="none" stroke="#151826" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="2 14"/>
  <circle cx="600" cy="470" r="262" fill="none" stroke="#151826" stroke-opacity="0.12" stroke-width="3"/>
  <rect x="90" y="620" width="200" height="200" fill="url(#halftone)"/>
  <circle cx="1050" cy="160" r="26" fill="#ffd3b6"/>
  <circle cx="180" cy="220" r="16" fill="#ffffff" opacity="0.8"/>

  <!-- shadow -->
  <ellipse cx="610" cy="706" rx="290" ry="30" fill="#151826" opacity="0.12"/>

  <!-- cap -->
  <g>
    <!-- brim (tucked under the dome) -->
    <path d="M 600 552
             C 770 536 932 554 990 612
             C 1006 628 996 654 968 658
             C 832 682 692 668 596 634 Z"
          fill="#232839"/>
    <path d="M 662 592 C 792 582 912 596 954 624" fill="none" stroke="#6dd5c4" stroke-width="5" stroke-opacity="0.7" stroke-linecap="round"/>
    <!-- dome -->
    <path d="M 330 566 A 270 236 0 0 1 870 566 Z" fill="#151826"/>
    <!-- panel seams -->
    <path d="M 486 336 A 270 236 0 0 0 452 566" fill="none" stroke="#f8f8f3" stroke-opacity="0.22" stroke-width="5"/>
    <path d="M 714 336 A 270 236 0 0 1 748 566" fill="none" stroke="#f8f8f3" stroke-opacity="0.22" stroke-width="5"/>
    <!-- top button -->
    <circle cx="600" cy="332" r="18" fill="#6dd5c4" stroke="#151826" stroke-width="4"/>
    <!-- AM monogram -->
    <text x="600" y="512" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#6dd5c4">AM</text>
  </g>

  <text x="80" y="112" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#4a5064">THE SHOP</text>
  <text x="82" y="152" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="4" fill="#4a5064" opacity="0.8">MONOGRAM CAP · INK</text>
</svg>
