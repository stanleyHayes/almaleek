<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Brand campaign scene with megaphone, phone playing a skit, brand cards and a rising chart line">
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4.5" fill="#151826" opacity="0.16"/>
    </pattern>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7d8ff"/>
      <stop offset="1" stop-color="#b8c0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#dff6f0"/>

  <!-- background geometry -->
  <circle cx="1080" cy="120" r="290" fill="#ffd3b6"/>
  <circle cx="1080" cy="120" r="360" fill="none" stroke="#151826" stroke-opacity="0.13" stroke-width="2.5"/>
  <circle cx="1080" cy="120" r="420" fill="none" stroke="#151826" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M -70 780 A 420 420 0 0 1 350 360" fill="none" stroke="#6dd5c4" stroke-width="26" stroke-linecap="round"/>
  <path d="M -40 838 A 490 490 0 0 1 448 352" fill="none" stroke="#151826" stroke-opacity="0.16" stroke-width="4"/>
  <rect x="70" y="620" width="330" height="230" fill="url(#dots)"/>
  <circle cx="210" cy="200" r="140" fill="url(#glow)"/>
  <circle cx="80" cy="480" r="18" fill="#b8c0ff"/>
  <circle cx="520" cy="860" r="14" fill="#ffd3b6"/>

  <!-- header -->
  <text x="70" y="100" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#4a7069">CAMPAIGNS · AL MALEEK &amp; CREW</text>
  <text x="72" y="142" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="5" fill="#65697a">BRAND STORIES · LOUD AND CLEAR</text>

  <!-- megaphone -->
  <g transform="translate(350,470) rotate(-12)">
    <!-- handle -->
    <rect x="-132" y="46" width="36" height="118" rx="17" fill="#151826" transform="rotate(14 -114 46)"/>
    <!-- cone body -->
    <path d="M -150 -54 L 82 -124 L 82 124 L -150 54 Z" fill="#151826"/>
    <!-- back cap -->
    <rect x="-192" y="-54" width="46" height="108" rx="20" fill="#65697a"/>
    <!-- cone stripe -->
    <path d="M -116 -40 L 40 -86" stroke="#6dd5c4" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <!-- bell rim -->
    <ellipse cx="88" cy="0" rx="26" ry="126" fill="#6dd5c4" stroke="#151826" stroke-width="6"/>
    <ellipse cx="88" cy="0" rx="11" ry="76" fill="#151826"/>
  </g>

  <!-- megaphone sound arcs -->
  <path d="M 512 316 A 132 132 0 0 1 560 486" fill="none" stroke="#6dd5c4" stroke-width="10" stroke-linecap="round"/>
  <path d="M 566 288 A 196 196 0 0 1 636 514" fill="none" stroke="#151826" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
  <path d="M 622 262 A 262 262 0 0 1 716 544" fill="none" stroke="#ffd3b6" stroke-width="8" stroke-linecap="round"/>

  <!-- phone with skit frame -->
  <g transform="translate(878,500) rotate(6)">
    <rect x="-152" y="-272" width="304" height="544" rx="52" fill="#151826"/>
    <rect x="-127" y="-246" width="254" height="496" rx="38" fill="url(#screenGrad)"/>
    <rect x="-48" y="-232" width="96" height="16" rx="8" fill="#151826"/>

    <!-- skit frame card -->
    <rect x="-102" y="-186" width="204" height="168" rx="22" fill="#ffffff" stroke="#151826" stroke-width="5"/>
    <circle cx="66" cy="-152" r="34" fill="#e7d8ff" opacity="0.8"/>
    <!-- tiny performer -->
    <circle cx="-34" cy="-128" r="26" fill="#151826"/>
    <ellipse cx="-34" cy="-120" rx="11" ry="8" fill="#ffd3b6"/>
    <path d="M -46 -138 A 5 5 0 0 1 -36 -138" fill="none" stroke="#f8f8f3" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -30 -138 A 5 5 0 0 1 -20 -138" fill="none" stroke="#f8f8f3" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -62 -52 L -62 -96 A 28 28 0 0 1 -6 -96 L -6 -52 Z" fill="#151826"/>
    <!-- play button -->
    <circle cx="42" cy="-78" r="26" fill="#6dd5c4" stroke="#151826" stroke-width="5"/>
    <path d="M 34 -90 L 56 -78 L 34 -66 Z" fill="#151826"/>

    <!-- AD chip -->
    <g transform="translate(-78,42)">
      <rect x="0" y="0" width="74" height="38" rx="19" fill="#ffd3b6" stroke="#151826" stroke-width="4"/>
      <text x="37" y="27" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#151826">AD</text>
    </g>
    <!-- caption lines -->
    <rect x="-78" y="102" width="156" height="12" rx="6" fill="#151826" opacity="0.7"/>
    <rect x="-78" y="128" width="112" height="12" rx="6" fill="#151826" opacity="0.35"/>
    <rect x="-78" y="154" width="134" height="12" rx="6" fill="#6dd5c4"/>
    <!-- progress -->
    <rect x="-78" y="196" width="156" height="10" rx="5" fill="#151826" opacity="0.2"/>
    <rect x="-78" y="196" width="96" height="10" rx="5" fill="#151826"/>
  </g>

  <!-- floating brand card -->
  <g transform="translate(118,224) rotate(-8)">
    <rect x="0" y="0" width="216" height="138" rx="28" fill="#ffffff" stroke="#151826" stroke-width="5"/>
    <circle cx="40" cy="40" r="17" fill="#6dd5c4"/>
    <rect x="70" y="28" width="110" height="12" rx="6" fill="#151826" opacity="0.75"/>
    <rect x="26" y="66" width="164" height="12" rx="6" fill="#151826" opacity="0.35"/>
    <rect x="26" y="94" width="96" height="14" rx="7" fill="#b8c0ff"/>
  </g>

  <!-- AM tag -->
  <g transform="translate(1052,712) rotate(10)">
    <circle cx="0" cy="0" r="56" fill="#ffd3b6" stroke="#151826" stroke-width="5"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#151826" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="2 14"/>
    <text x="0" y="15" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-2" fill="#151826">AM</text>
  </g>

  <!-- rising chart line -->
  <polyline points="470,800 566,752 652,778 726,696" fill="none" stroke="#b8c0ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="470" cy="800" r="12" fill="#ffffff" stroke="#b8c0ff" stroke-width="6"/>
  <circle cx="566" cy="752" r="12" fill="#ffffff" stroke="#b8c0ff" stroke-width="6"/>
  <circle cx="652" cy="778" r="12" fill="#ffffff" stroke="#b8c0ff" stroke-width="6"/>
  <path d="M 726 696 L 690 690 M 726 696 L 704 664" fill="none" stroke="#b8c0ff" stroke-width="10" stroke-linecap="round"/>
</svg>
